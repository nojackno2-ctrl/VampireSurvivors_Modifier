name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  release-validation:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Validate version source
        shell: pwsh
        run: ./scripts/Assert-Version.ps1

      - name: Restore win-x64 assets
        run: dotnet restore VSModifier.slnx --runtime win-x64 --configfile NuGet.Config

      - name: Build Release with analyzers
        run: dotnet build VSModifier.slnx --configuration Release --no-restore

      - name: Run console test suite
        run: dotnet run --project VSModifier.Tests --configuration Release --no-build --no-restore

      - name: Build and audit portable release
        shell: pwsh
        run: ./scripts/build-release.ps1 -NoRestore

      - name: Upload audited release candidate
        uses: actions/upload-artifact@v6
        with:
          name: VSModifier-release-candidate
          path: |
            artifacts/release/*/*.zip
            artifacts/release/*/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
